    <h1 class="djjoe">Contact Me</h1>
    <form action="index.php" method="post">
      <div class="field">
        <label for="Name">Name:</label>
        <input
          type="text"
          id="name"
          maxlength="20"
          required
          placeholder="Eg. Ivy Omwenga"
        />
      </div>
      <div class="field">
        <label for="Email">Email:</label>
        <input
          type="text"
          id="email"
          maxlength="30"
          required
          placeholder="IvyOmwenga@gmail.com"
        />
      </div>
      <div class="field">
        <label for="Number">Phone Number:</label>
        <input
          type="tel"
          id="number "
          value="+254"
          maxlength="13"
          pattern="[0-9]*"
          inputmode="numeric"
          required
          placeholder="712345678"
        />
      </div>
      <button type="submit">SUBMIT</button>
    </form>
