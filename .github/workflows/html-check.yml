# Checks every HTML file for real mistakes (unclosed tags, broken attributes,
# invalid nesting) on every push. Style-only rules are off: see .htmlvalidate.json.
# Run it yourself first:  npx html-validate@11 "**/*.html"
name: html-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate HTML
        run: npx --yes html-validate@11 "**/*.html"
